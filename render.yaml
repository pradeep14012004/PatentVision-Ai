# Free Render backend. Configure PostgreSQL and Supabase Storage in the dashboard.
services:
  - type: web
    name: patentvision-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PV_DATABASE_URL
        sync: false
      - key: PV_STORAGE_BACKEND
        value: supabase
      - key: PV_SUPABASE_URL
        sync: false
      - key: PV_SUPABASE_SERVICE_KEY
        sync: false
      - key: PV_SUPABASE_BUCKET
        value: patentvision-files
      - key: PV_SECRET_KEY
        generateValue: true
      - key: PV_CORS_ORIGINS
        sync: false
