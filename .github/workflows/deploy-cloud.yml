name: Deploy PatentVision AI to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patentvision-hf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face Hub client
        run: pip install --upgrade huggingface_hub
      - name: Create Spaces, configure backend and upload code
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_BACKEND_SPACE: ${{ vars.HF_BACKEND_SPACE }}
          HF_FRONTEND_SPACE: ${{ vars.HF_FRONTEND_SPACE }}
          PV_SECRET_KEY: ${{ secrets.PV_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          username = os.environ["HF_USERNAME"].strip()
          backend_name = os.environ.get("HF_BACKEND_SPACE", "patentvision-backend").strip()
          frontend_name = os.environ.get("HF_FRONTEND_SPACE", "patentvision-frontend").strip()
          if not username:
              raise SystemExit("Set repository variable HF_USERNAME to your Hugging Face username.")
          api = HfApi(token=token)
          backend_id = f"{username}/{backend_name}"
          frontend_id = f"{username}/{frontend_name}"

          api.create_repo(repo_id=backend_id, repo_type="space", space_sdk="docker", private=False, exist_ok=True, token=token)
          api.create_repo(repo_id=frontend_id, repo_type="space", space_sdk="gradio", private=False, exist_ok=True, token=token)

          secret = os.environ.get("PV_SECRET_KEY", "")
          if not secret:
              raise SystemExit("Set PV_SECRET_KEY as a GitHub Actions secret (32+ random characters).")
          api.add_space_secret(repo_id=backend_id, key="PV_SECRET_KEY", value=secret, token=token)
          api.add_space_variable(repo_id=backend_id, key="PV_STORAGE_BACKEND", value="local", token=token)
          api.add_space_variable(repo_id=backend_id, key="PV_DATABASE_URL", value="sqlite:////home/user/app/patentvision.db", token=token)
          api.add_space_variable(repo_id=backend_id, key="PV_CORS_ORIGINS", value="*", token=token)
          api.add_space_variable(repo_id=frontend_id, key="BACKEND_URL", value=f"https://{username}-{backend_name}.hf.space", token=token)

          api.upload_folder(repo_id=backend_id, repo_type="space", folder_path=".", token=token,
              allow_patterns=["README.md", "Dockerfile", "backend/**"],
              ignore_patterns=["backend/**/__pycache__/**", "backend/**/*.pyc", "backend/**/.env*"])
          api.upload_folder(repo_id=frontend_id, repo_type="space", folder_path="spaces/frontend", token=token,
              ignore_patterns=["**/__pycache__/**", "**/*.pyc"])
          print(f"Backend Space: https://huggingface.co/spaces/{backend_id}")
          print(f"Frontend Space: https://huggingface.co/spaces/{frontend_id}")
          print(f"Frontend URL: https://{username}-{frontend_name}.hf.space")
          PY
