name: Deploy PatentVision AI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patentvision-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Trigger Render FastAPI deployment
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_API_URL != '' }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Add RENDER_DEPLOY_HOOK as a GitHub Actions secret."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"

  deploy-frontend:
    name: Build and deploy Next.js to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: ${{ always() && vars.RENDER_API_URL != '' && needs.deploy-backend.result == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --no-package-lock @opennextjs/cloudflare@latest wrangler@latest
      - name: Configure backend API URL
        env:
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          API_URL="${RENDER_API_URL%/}/api"
          echo "NEXT_PUBLIC_API_URL=$API_URL" >> "$GITHUB_ENV"
      - name: Build Next.js for Cloudflare
        working-directory: frontend
        run: npx opennextjs-cloudflare build
      - name: Deploy Cloudflare Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (repository variable)."
            exit 1
          fi
          npx wrangler deploy
