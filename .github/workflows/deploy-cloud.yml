name: Deploy PatentVision AI to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patentvision-hf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face Hub client
        run: pip install "huggingface_hub==0.36.0"
      - name: Create Spaces, configure backend and upload code
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "").strip()
          if not token:
              raise SystemExit("HF_TOKEN GitHub Actions secret is missing.")
          api = HfApi(token=token)
          identity = api.whoami()
          username = identity.get("name")
          if not username:
              raise SystemExit(f"Could not read Hugging Face username from token identity: {identity}")
          backend_name = "patentvision-backend"
          frontend_name = "patentvision-frontend"
          backend_id = f"{username}/{backend_name}"
          frontend_id = f"{username}/{frontend_name}"
          print(f"Authenticated Hugging Face account: {username}")
          print(f"Creating backend Space: {backend_id}")
          api.create_repo(repo_id=backend_id, repo_type="space", space_sdk="docker", private=False, exist_ok=True)
          print(f"Creating frontend Space: {frontend_id}")
          api.create_repo(repo_id=frontend_id, repo_type="space", space_sdk="gradio", private=False, exist_ok=True)

          import hashlib
          secret = hashlib.sha256((token + ":patentvision-demo-jwt-secret-v1").encode()).hexdigest()
          api.add_space_secret(repo_id=backend_id, key="PV_SECRET_KEY", value=secret)
          api.add_space_variable(repo_id=backend_id, key="PV_STORAGE_BACKEND", value="local")
          api.add_space_variable(repo_id=backend_id, key="PV_DATABASE_URL", value="sqlite:////home/user/app/patentvision.db")
          api.add_space_variable(repo_id=backend_id, key="PV_CORS_ORIGINS", value="*")
          api.add_space_variable(repo_id=frontend_id, key="BACKEND_URL", value=f"https://{username}-{backend_name}.hf.space")

          print("Uploading FastAPI backend files...")
          api.upload_folder(repo_id=backend_id, repo_type="space", folder_path=".",
              allow_patterns=["README.md", "Dockerfile", "backend/**"],
              ignore_patterns=["backend/**/__pycache__/**", "backend/**/*.pyc", "backend/**/.env*"])
          print("Uploading Gradio frontend files...")
          api.upload_folder(repo_id=frontend_id, repo_type="space", folder_path="spaces/frontend")
          print(f"Backend Space: https://huggingface.co/spaces/{backend_id}")
          print(f"Frontend Space: https://huggingface.co/spaces/{frontend_id}")
          print(f"Frontend URL: https://{username}-{frontend_name}.hf.space")
          PY
