name: Deploy PatentVision AI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patentvision-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy FastAPI to Hugging Face Spaces
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add HF_TOKEN as a GitHub Actions secret."
            exit 1
          fi
          git remote add space "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push space HEAD:main

  deploy-frontend:
    name: Build and deploy Next.js to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: ${{ always() && vars.HF_SPACE != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --no-package-lock @opennextjs/cloudflare@latest wrangler@latest
      - name: Configure backend API URL
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          SPACE_SLUG="$(printf '%s' "$HF_SPACE" | tr '[:upper:]' '[:lower:]' | tr '/' '-')"
          echo "NEXT_PUBLIC_API_URL=https://${SPACE_SLUG}.hf.space/api" >> "$GITHUB_ENV"
      - name: Build Next.js for Cloudflare
        working-directory: frontend
        run: npx opennextjs-cloudflare build
      - name: Deploy Cloudflare Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (repository variable)."
            exit 1
          fi
          npx wrangler deploy
